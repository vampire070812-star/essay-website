services:
  - type: web
    name: essay-grader
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # 试运行：必须登录（仅放行启动时播种的 100 个账号）
      - key: ALLOW_ANON_AI
        value: "0"
      - key: GRADES_PER_DAY
        value: "30"
      - key: ANALYZES_PER_DAY
        value: "60"
      # 试运行账号清单，格式：user001:密码,user002:密码,...（每次启动自动播种，防止免费实例磁盘重置丢账号）
      - key: TRIAL_ACCOUNTS
        sync: false
      # 手写作文照片识别（视觉模型，推荐智谱 glm-4v-flash 免费）；不配则前端自动回退浏览器本地识别
      - key: OCR_API_KEY
        sync: false
      - key: OCR_BASE_URL
        sync: false
      - key: OCR_MODEL
        sync: false
