services:
  - type: web
    name: essay-grader
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
